<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>北证 RSI 实验室仪表盘</title>
<style>
body{font-family:system-ui,"PingFang SC",sans-serif;background:#0f1419;color:#e7ecf3;margin:0;padding:24px 20px 48px;line-height:1.5}
main{max-width:1100px;margin:auto}h1{font-size:1.35rem;margin:0 0 4px}.sub,.muted{color:#8b9bb4;font-size:.85rem}.banner{background:#2a1f0e;border:1px solid #5c4a1e;color:#f0d78c;padding:10px 14px;border-radius:8px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}.card{background:#1a2332;border:1px solid #2d3a4f;border-radius:12px;padding:16px 18px;margin-top:14px}.big{font-size:4rem;font-weight:700;line-height:1;color:#3d9cf0}.band{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;background:#243044;color:#3ecf8e}.row{display:flex;align-items:center;gap:10px;margin:7px 0}.lbl{width:108px;color:#8b9bb4;font-size:.82rem}.track{flex:1;height:14px;background:#0c1017;border-radius:7px;overflow:hidden}.fill{height:100%;background:#3d9cf0}.fill.low{background:#f07178}.fill.mid{background:#f0b429}.tl{padding-left:22px}.ti{margin-bottom:14px}.tid{font-weight:600;color:#3d9cf0}table{width:100%;border-collapse:collapse;font-size:.78rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #2d3a4f}th{color:#8b9bb4}.tw{max-height:420px;overflow:auto}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
<body><main><h1>北证 RSI 实验室仪表盘</h1><div class="sub">bj50_rsi_lab · GitHub Pages 快照</div><p id="msg">正在验证访问口令…</p></main>
<script>
(async function(){
  const expected = "3e0f0152e0ab5e0d";
  const key = "bj50_rsi_pages_key";
  const supplied = new URLSearchParams(location.search).get("k") || sessionStorage.getItem(key);
  if (supplied !== expected) {
    document.getElementById("msg").innerHTML = '<span style="color:#f0b429">需要有效口令。</span> 请使用带 <code>?k=</code> 的链接访问。';
    return;
  }
  sessionStorage.setItem(key, supplied);
  try {
    const D = await fetch("data.json", {cache:"no-store"}).then(r => r.json());
    const sc=D.score||{}, meta=D.meta||{}, fit=D.fitness||{};
    const esc=x=>String(x==null?"—":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    const dims=(D.dims||[]).map(d=>`<div class="row"><div class="lbl">${esc(d.label||d.key)}</div><div class="track"><div class="fill ${d.value<8?"low":d.value<14?"mid":""}" style="width:${Math.max(0,Math.min(100,d.value/(d.max||20)*100))}%"></div></div><div>${esc(d.value)}</div></div>`).join("");
    const gens=(D.generations||[]).map(g=>`<div class="ti"><div class="tid">${esc(g.id)} · ${esc(g.title||"")}</div><div>${esc(g.state)}</div><div>${esc(g.short)}</div><div class="muted">${esc(g.asof||"")}</div></div>`).join("")||"暂无代际";
    const rows=(fit.rows||[]).map(r=>`<tr>${[r.generation,r.variant,r.n,r.win_rate,r.mean_ret,r.compounded,r.status].map(esc).map(x=>`<td>${x}</td>`).join("")}</tr>`).join("");
    document.querySelector("main").innerHTML=`<h1>北证 RSI 实验室仪表盘</h1><div class="sub">bj50_rsi_lab · 同步于 ${esc(D.synced_at)}</div><div class="banner">${esc(D.disclaimer)}</div><div class="grid"><section class="card"><div class="muted">过程分（≠ 收益）</div><div class="big">${esc(sc.total)}</div><span class="band">${esc(sc.band_zh||sc.band)}</span><p class="muted">asof ${esc(sc.asof)} · 瓶颈 ${esc(sc.bottleneck_label||sc.bottleneck)} → ${esc(sc.next_focus)}</p></section><section class="card"><div class="muted">五维条形（各满分 20）</div>${dims}</section></div><section class="card"><div class="muted">代际时间线</div><div class="tl">${gens}</div></section><section class="card"><div class="muted">Meta / 门禁</div><p>last_batch：${esc(meta.last_batch)} / ${esc(meta.last_batch_result)}</p><p>live_ssot_lock：${esc(meta.live_ssot_lock)} · generations_no_gain：${esc(meta.generations_no_gain)}</p></section><section class="card"><div class="muted">Fitness 账本（${esc((fit.summary||{}).n_rows||0)} 行）</div><div class="tw"><table><thead><tr><th>代</th><th>变体</th><th>n</th><th>胜率</th><th>均值</th><th>复利</th><th>状态</th></tr></thead><tbody>${rows}</tbody></table></div></section></main>`;
  } catch (e) { document.getElementById("msg").textContent="数据加载失败，请稍后重试。"; }
})();
</script></body></html>
